      children:
        - file: navigate_geolab/basic_navigation.md
        - file: navigate_geolab/geolab_terminal.md
        - file: navigate_geolab/How_to_Notebook.ipynb
        - file: navigate_geolab/using_git.md
    - title: Advanced Topics
      children:
        - file: advanced_topics/env_mgmt.md
