# Building this repo with Python requirements.txt and Jupyter Book
# (as opposed to using Node.js and mystmd) in case we want to use some
# other Python packages such as notebooks in the future.
[build]
  publish = "publish"
  command = """
    pip install -r requirements.txt && \
    jupyter book build --html && \
    mkdir -p publish$BASE_URL && \
    mv _build/html/* publish$BASE_URL/
  """

[build.environment]
  BASE_URL = "/geolab"
  PYTHON_VERSION = "3.12"
